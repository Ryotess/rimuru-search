name: Bug report
description: Report a reproducible problem in Rimuru Search.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Rimuru Search. Remove credentials, private data,
        internal hostnames, and proprietary documents before submitting.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
      placeholder: Include the smallest useful example.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide a minimal sequence that consistently reproduces the issue.
      placeholder: |
        1. Start with ...
        2. Send ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA, tag, or branch where the problem occurs.
      placeholder: main at abc1234
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python, Docker/Compose, PostgreSQL, and model runtime versions that matter.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only redacted logs or stack traces.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials, personal data, and proprietary content.
          required: true
        - label: This is not a security vulnerability.
          required: true
