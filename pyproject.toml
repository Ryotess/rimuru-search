[project]
name = "rimuru-search-api"
version = "0.1.0"
description = "Run hybrid search locally or in production with PostgreSQL BM25, pgvector, RRF, and optional reranking"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
keywords = [
    "full-text-search",
    "bm25",
    "hybrid-search",
    "information-retrieval",
    "pgvector",
    "postgresql",
    "reranking",
    "semantic-search",
    "vector-search",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "alembic>=1.17.2",
    "fastapi>=0.141.1",
    "greenlet>=3.2.4",
    "httpx>=0.28.1",
    "litellm==1.98.0",
    "loguru>=0.7.3",
    "numpy<2.3",
    "pgvector>=0.4.1",
    "psycopg[binary]>=3.2.4",
    "pydantic-settings>=2.14.2",
    "redis[hiredis]>=5.0",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
]

[project.urls]
Documentation = "https://github.com/Ryotess/rimuru-search#readme"
Issues = "https://github.com/Ryotess/rimuru-search/issues"
Repository = "https://github.com/Ryotess/rimuru-search"

[dependency-groups]
dev = [
    "fakeredis>=2.20",
    "ipykernel>=7.1.0",
    "mypy>=2.3.1",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.14.7",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
allowed-confusables = ["×", "–"]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "ASYNC",
    "SIM",
    "PIE",
    "PERF",
    "RUF",
    "S",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
files = ["src"]
mypy_path = "."
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
disallow_any_generics = true
show_error_codes = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true
